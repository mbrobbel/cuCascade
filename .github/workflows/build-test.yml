name: Build and test

on:
  workflow_call:
    inputs:
      cuda:
        required: true
        type: number
      rapids:
        required: true
        type: string

env:
  CUCASCADE_PIXI_ENV: ${{ format('cuda-{0}-{1}', inputs.cuda, inputs.rapids) }}

jobs:
  build:
    runs-on: linux-amd64-cpu4

    env:
      SCCACHE_GHA_ENABLED: true
      CONDA_OVERRIDE_CUDA: ${{ inputs.cuda == 12 && '12.9' || '13' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false
          environments: ${{ env.CUCASCADE_PIXI_ENV }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - run: pixi run -e "$CUCASCADE_PIXI_ENV" build

      - name: Package build artifacts
        run: tar -cf build-release.tar build/release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-release-cuda-${{ inputs.cuda }}-${{ inputs.rapids }}
          path: build-release.tar
          if-no-files-found: error
          retention-days: 1

  test:
    needs: build
    runs-on: linux-amd64-gpu-t4-latest-1

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false
          environments: ${{ env.CUCASCADE_PIXI_ENV }}

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-release-cuda-${{ inputs.cuda }}-${{ inputs.rapids }}

      - name: Extract build artifacts
        run: tar -xf build-release.tar

      - name: Run tests
        id: test
        run: pixi run -e "$CUCASCADE_PIXI_ENV" test --output-junit test-results.xml

      - name: Upload test diagnostics
        id: diagnostics
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-cuda-${{ inputs.cuda }}-${{ inputs.rapids }}
          path: |
            build/release/test-results.xml
            build/release/Testing/Temporary/
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ !cancelled() && steps.diagnostics.outputs.artifact-url != '' }}
        env:
          CUDA_VERSION: ${{ inputs.cuda }}
          RAPIDS_CHANNEL: ${{ inputs.rapids }}
          TEST_RESULT: ${{ steps.test.outcome }}
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          {
            echo "## Tests: CUDA ${CUDA_VERSION}, RAPIDS ${RAPIDS_CHANNEL}"
            echo "CTest result: **${TEST_RESULT}**"
            echo
            echo "[Download JUnit results and CTest logs](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
