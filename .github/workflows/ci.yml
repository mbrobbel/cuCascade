name: ci

on:
  push:
    branches:
      - "main"
      - "pull-request/[0-9]+"

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' &&
    startsWith(github.ref, 'refs/heads/pull-request/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') }}

jobs:
  lint:
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  build-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        cuda: [12, 13]
        rapids: [nightly, stable]
    uses: ./.github/workflows/build-test.yml
    with:
      cuda: ${{ matrix.cuda }}
      rapids: ${{ matrix.rapids }}

  check:
    runs-on: ubuntu-slim
    needs: [lint, build-test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: All checks ok
        if: ${{ needs.lint.result == 'success' && needs.build-test.result == 'success' }}
        run: exit 0
      - name: Some checks failed
        if: ${{ !(needs.lint.result == 'success' && needs.build-test.result == 'success') }}
        run: exit 1
